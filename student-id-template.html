<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student ID Template</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #f0f0f0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .id-card {
            width: 3.375in; /* Standard ID card width */
            height: 2.125in; /* Standard ID card height */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .id-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .photo-section {
            width: 120px;
            height: 150px;
            background: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .photo-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 12px;
            text-align: center;
            padding: 10px;
        }

        .photo-placeholder svg {
            width: 60px;
            height: 60px;
            margin-bottom: 8px;
            opacity: 0.5;
        }

        .photo-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .info-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }

        .school-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .student-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 12px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .student-id-label {
            font-size: 10px;
            opacity: 0.9;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .student-id-number {
            font-size: 16px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .details-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-top: 8px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            opacity: 0.8;
            font-size: 9px;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .detail-value {
            font-weight: bold;
            font-size: 11px;
        }

        .barcode-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        .barcode {
            height: 30px;
            background: white;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            font-weight: bold;
        }

        .editable {
            cursor: pointer;
            transition: background 0.2s;
        }

        .editable:hover {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 2px 4px;
            margin: -2px -4px;
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            max-width: 300px;
        }

        .controls h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 16px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #666;
            font-weight: 500;
        }

        .control-group input,
        .control-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .control-group input[type="file"] {
            padding: 4px;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #5568d3;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .controls {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="controls">
        <h3>Student ID Editor</h3>
        
        <div class="control-group">
            <label>School/University Name</label>
            <input type="text" id="schoolName" value="UNIVERSITY NAME" placeholder="Enter school name">
        </div>

        <div class="control-group">
            <label>Student Name</label>
            <input type="text" id="studentName" value="JOHN DOE" placeholder="Enter student name">
        </div>

        <div class="control-group">
            <label>Student ID Number</label>
            <input type="text" id="studentId" value="2024-12345" placeholder="Enter ID number">
        </div>

        <div class="control-group">
            <label>Program/Course</label>
            <input type="text" id="program" value="Computer Science" placeholder="Enter program">
        </div>

        <div class="control-group">
            <label>Valid Until</label>
            <input type="text" id="validUntil" value="2025-12-31" placeholder="Enter expiration date">
        </div>

        <div class="control-group">
            <label>Student Photo</label>
            <input type="file" id="photoInput" accept="image/*">
        </div>

        <button class="btn" onclick="window.print()">Print ID Card</button>
        <button class="btn" onclick="downloadCard()" style="background: #28a745; margin-top: 5px;">Download as Image</button>
    </div>

    <div class="id-card" id="idCard">
        <div class="photo-section">
            <div class="photo-placeholder" id="photoPlaceholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span>Student<br>Photo</span>
            </div>
            <img id="studentPhoto" alt="Student Photo">
        </div>

        <div class="info-section">
            <div>
                <div class="school-name" id="schoolNameDisplay">UNIVERSITY NAME</div>
                <div class="student-name" id="studentNameDisplay">JOHN DOE</div>
                
                <div>
                    <div class="student-id-label">Student ID</div>
                    <div class="student-id-number" id="studentIdDisplay">2024-12345</div>
                </div>
            </div>

            <div>
                <div class="details-row">
                    <div class="detail-item">
                        <div class="detail-label">Program</div>
                        <div class="detail-value" id="programDisplay">Computer Science</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Valid Until</div>
                        <div class="detail-value" id="validUntilDisplay">2025-12-31</div>
                    </div>
                </div>

                <div class="barcode-section">
                    <div class="barcode" id="barcode">|||| |||| |||| ||||</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Update functions
        function updateSchoolName() {
            document.getElementById('schoolNameDisplay').textContent = 
                document.getElementById('schoolName').value.toUpperCase() || 'UNIVERSITY NAME';
        }

        function updateStudentName() {
            document.getElementById('studentNameDisplay').textContent = 
                document.getElementById('studentName').value.toUpperCase() || 'JOHN DOE';
        }

        function updateStudentId() {
            document.getElementById('studentIdDisplay').textContent = 
                document.getElementById('studentId').value || '2024-12345';
            updateBarcode();
        }

        function updateProgram() {
            document.getElementById('programDisplay').textContent = 
                document.getElementById('program').value || 'Computer Science';
        }

        function updateValidUntil() {
            document.getElementById('validUntilDisplay').textContent = 
                document.getElementById('validUntil').value || '2025-12-31';
        }

        function updateBarcode() {
            const id = document.getElementById('studentId').value || '2024-12345';
            // Simple barcode representation
            const barcode = id.replace(/[^0-9]/g, '').split('').map(() => '|').join(' ');
            document.getElementById('barcode').textContent = barcode || '|||| |||| |||| ||||';
        }

        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('studentPhoto');
                    const placeholder = document.getElementById('photoPlaceholder');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    placeholder.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        }

        function downloadCard() {
            const card = document.getElementById('idCard');
            html2canvas(card, {
                backgroundColor: null,
                scale: 3,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'student-id-card.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        // Event listeners
        document.getElementById('schoolName').addEventListener('input', updateSchoolName);
        document.getElementById('studentName').addEventListener('input', updateStudentName);
        document.getElementById('studentId').addEventListener('input', updateStudentId);
        document.getElementById('program').addEventListener('input', updateProgram);
        document.getElementById('validUntil').addEventListener('input', updateValidUntil);
        document.getElementById('photoInput').addEventListener('change', handlePhotoUpload);

        // Load html2canvas library for download functionality
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        document.head.appendChild(script);
    </script>
</body>
</html>
