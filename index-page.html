<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Editor - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 60px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 36px;
        }

        p {
            color: #666;
            margin-bottom: 40px;
            font-size: 18px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .option-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .option-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .option-card h2 {
            margin-bottom: 10px;
            font-size: 24px;
        }

        .option-card p {
            color: rgba(255, 255, 255, 0.9);
            margin: 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Content Editor</h1>
        <p>Choose an option to get started</p>
        
        <div class="options">
            <a href="index.html" class="option-card">
                <h2>📝 Interactive Editor</h2>
                <p>Create and edit content with drag-and-drop functionality</p>
            </a>
            
            <a href="student-id-template.html" class="option-card">
                <h2>🆔 Student ID Template</h2>
                <p>Create professional student ID cards</p>
            </a>
        </div>
    </div>
</body>
</html>
