<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Content Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Toolbar -->
        <div class="toolbar">
            <div class="toolbar-section">
                <button class="tool-btn" id="addTextBtn" title="Add Text">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 20h16M6 16h12M8 12h8M10 8h4M12 4v16"/>
                    </svg>
                    <span>Text</span>
                </button>
                <button class="tool-btn" id="addImageBtn" title="Add Image">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <path d="M21 15l-5-5L5 21"/>
                    </svg>
                    <span>Image</span>
                </button>
                <input type="file" id="imageInput" accept="image/*" style="display: none;">
            </div>
            
            <div class="toolbar-section">
                <button class="tool-btn" id="deleteBtn" title="Delete Selected" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                    <span>Delete</span>
                </button>
                <button class="tool-btn" id="clearBtn" title="Clear All">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                    <span>Clear</span>
                </button>
            </div>

            <div class="toolbar-section">
                <button class="tool-btn" id="downloadBtn" title="Download as Image">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                    </svg>
                    <span>Download</span>
                </button>
            </div>
        </div>

        <!-- Canvas Area -->
        <div class="canvas-container" id="canvas">
            <div class="canvas-grid"></div>
            <!-- Elements will be added here -->
        </div>

        <!-- Properties Panel -->
        <div class="properties-panel" id="propertiesPanel">
            <h3>Properties</h3>
            <div id="propertiesContent">
                <p class="no-selection">Select an element to edit properties</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
